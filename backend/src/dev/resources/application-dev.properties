# Development overrides, activated by the Maven "dev" profile (backend/build_dev.sh).
#
# Nothing here reaches production: src/dev/resources is only added to the
# classpath by the "dev" profile, and Quarkus loads application-dev.properties
# only while the dev profile is active.

quarkus.http.port=9091
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:3001
auth.frontend-origin=http://localhost:3001

# In-memory H2, built and seeded once on every start by DevDataInitializer. YEAR and VALUE became
# reserved words in H2 2.x, so they are declared as non-keywords.
#
# There is deliberately no INIT clause: H2 runs it on every connection it opens, and the table
# script drops every table, so each new pooled connection emptied the database. DB_CLOSE_DELAY=-1
# keeps the database for as long as the application runs - without it H2 discards an in-memory
# database when its last connection closes, which the pool does to idle connections, and nothing
# would build it again.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:default;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=YEAR,VALUE
quarkus.datasource.jdbc.driver=org.h2.Driver
quarkus.datasource.username=sa
quarkus.datasource.password=

# Development logs in for real, like production: there is no bypass any more. These credentials
# exist only here, on the development classpath, so the real git-crypt encrypted users.json is
# never needed to run the application locally. Log in as dev / dev.
#
# The name has to be configured rather than relying on classpath order: the dev Maven profile
# lists src/main/resources first, so a file called users.json here would lose to the real one.
auth.users-resource=dev-users.json
auth.token-secret=development-token-secret-not-used-anywhere-real

# Sample export standing in for the NAS data volume, so /sync works without the
# desktop app. Schema, accounts and transactions are synced from here.
#
# To work against a real desktop export instead, run build_dev.sh --data-dir <path>, or set
# DEV_DATA_DIR once in the git-ignored backend/.env. Either sets DATA_LOCATION, which outranks
# this file because MicroProfile Config reads environment variables at a higher ordinal. Real
# accounting data must stay outside the repository: this directory is committed in the clear.
#
# The sample data is derived from the test fixtures, so the years are uneven:
# 2020 is the only one with a complete eight-class schema and is therefore the
# active year. The accounting views (balance, profit, cash flow) need that full
# schema and will fail on the thinner years.
data.location=src/dev/resources/data/
