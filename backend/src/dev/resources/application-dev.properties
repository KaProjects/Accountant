# Development overrides, activated by the Maven "dev" profile (backend/build_dev.sh).
#
# Nothing here reaches production: src/dev/resources is only added to the
# classpath by the "dev" profile, and Quarkus loads application-dev.properties
# only while the dev profile is active.

quarkus.http.port=9091
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:3001

# In-memory H2 seeded from the dev budgeting data. YEAR and VALUE became
# reserved words in H2 2.x, so they are declared as non-keywords.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:default;MODE=MySQL;NON_KEYWORDS=YEAR,VALUE;INIT=RUNSCRIPT FROM 'classpath:createDevDb.sql'
quarkus.datasource.jdbc.driver=org.h2.Driver
quarkus.datasource.username=sa
quarkus.datasource.password=

environment=DEVEL
auth.bypass=true

# Sample export standing in for the NAS data volume, so /sync works without the
# desktop app. Schema, accounts and transactions are synced from here.
#
# The sample data is derived from the test fixtures, so the years are uneven:
# 2020 is the only one with a complete eight-class schema and is therefore the
# active year. The accounting views (balance, profit, cash flow) need that full
# schema and will fail on the thinner years.
data.location=src/dev/resources/data/
