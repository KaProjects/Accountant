# Environment variables normally outrank a properties file, which let values meant for the
# production container leak into the test JVM: DATA_LOCATION pointed the datasource tests at a
# path that only exists inside the container. A higher ordinal keeps this file authoritative for
# tests, while a -D system property can still override any single value.
config_ordinal=350

quarkus.datasource.db-kind=h2
# Kept open for the life of the JVM rather than built by an INIT clause, which H2 runs on every
# new connection: TestDatabase builds it once per application start instead.
quarkus.datasource.jdbc.url=jdbc:h2:mem:default;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=YEAR,VALUE
test.database.fixture=classpath:createTestDb.sql
quarkus.datasource.jdbc.driver=org.h2.Driver
quarkus.http.cors.enabled=false
quarkus.http.cors.origins=
data.location=target/test-datasource/
auth.token-secret=test-token-secret-not-used-anywhere-real
auth.frontend-origin=http://accountant.test
# Adds the @QuarkusTest coverage to the plain unit tests' rather than replacing it.
quarkus.jacoco.reuse-data-file=true
# A free port of the system's choosing rather than the fixed 8081, which the dev server's own
# continuous testing also takes: a suite run while it was up failed to start on a bound port.
quarkus.http.test-port=0
