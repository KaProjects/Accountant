# Environment variables normally outrank a properties file, which let values meant for the
# production container leak into the test JVM: ENVIRONMENT=PRODUCTION switched the auth
# filter on and DATA_LOCATION pointed the datasource tests at a path that only exists
# inside the container. A higher ordinal keeps this file authoritative for tests, while a
# -D system property can still override any single value.
config_ordinal=350

quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:default;MODE=MySQL;NON_KEYWORDS=YEAR,VALUE;INIT=RUNSCRIPT FROM 'sql/createTables.sql'\\;RUNSCRIPT FROM 'classpath:createTestDb.sql'
quarkus.datasource.jdbc.driver=org.h2.Driver
environment=TEST
auth.bypass=true
quarkus.http.cors.enabled=false
quarkus.http.cors.origins=
data.location=target/test-datasource/
