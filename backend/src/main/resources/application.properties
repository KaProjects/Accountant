quarkus.datasource.jdbc.url=${JDBC_URL}
quarkus.datasource.db-kind=${DB_KIND}
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}

quarkus.http.port=${HTTP_PORT:8080}
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${FRONTEND_ORIGIN}
# The session is a cookie, and a browser only sends one cross-origin when the server says it may.
quarkus.http.cors.access-control-allow-credentials=true

data.location=${DATA_LOCATION}

# Swagger UI is a development tool. Quarkus leaves it out of a production build unless told
# otherwise, and it used to be told otherwise - which published a complete, unauthenticated
# map of every endpoint and its parameters. These routes are served by an extension rather
# than by JAX-RS, so the authentication filter never saw them and could not have protected
# them. Leaving them out of the production build removes the surface instead of guarding it.
%prod.quarkus.smallrye-openapi.enable=false
quarkus.swagger-ui.path=/api/docs
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=AccountantSecurity

# A native image embeds only the resources it is told to. users.json is read from the
# classpath at runtime, so without this it is simply absent from the production binary and
# every login fails, while the JVM build works fine.
quarkus.native.resources.includes=users.json

# Session tokens are signed with this and there is deliberately no default: the backend refuses to
# start without it rather than issuing tokens anybody could forge. Verifying the issuer as well
# means a token signed by some other application with the same secret is still rejected.
auth.token-secret=${AUTH_TOKEN_SECRET:}
mp.jwt.verify.issuer=accountant

# The one origin a state-changing request may come from, checked alongside a header no form on
# another site can set.
auth.frontend-origin=${FRONTEND_ORIGIN}

# Fields with no value are left out of the JSON rather than written as null - what the frontend has
# always been sent, from when the JSON was written by JSON-B, which leaves them out by default.
quarkus.jackson.serialization-inclusion=non_null
