quarkus.datasource.jdbc.url=${JDBC_URL}
quarkus.datasource.db-kind=${DB_KIND}
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}

quarkus.http.port=${HTTP_PORT:8080}
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${FRONTEND_ORIGIN}

environment=${ENVIRONMENT:PRODUCTION}
data.location=${DATA_LOCATION}

quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/api/docs
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=AccountantSecurity

# A native image embeds only the resources it is told to. users.json is read from the
# classpath at runtime, so without this it is simply absent from the production binary and
# every login fails, while the JVM build works fine.
quarkus.native.resources.includes=users.json
